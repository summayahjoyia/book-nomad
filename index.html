<!DOCTYPE html>
<html>
        <head>
            <script src="https://unpkg.com/globe.gl"></script>
            <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
        </head>
        <body>
            <div id="globe">

            </div>
            <script>
                const myGlobe = new Globe(document.getElementById("globe")).globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-day.jpg')
                fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQmLBrYzwJbawiNJ76gGy7r2B8b1Mn6ywrudVrGZBCeVs8WtsKStSItqrJZh2TK-QE_3E6Qd6mDJNtG/pub?gid=0&single=true&output=csv")
  .then(res     => res.text())
   .then(text => {
    const rows = Papa.parse(text, { header: true, skipEmptyLines: true }).data
    const read = {}
    rows.forEach(row=>{
        const country = (row.country || "").trim()
        const hasBook = [row.summayah, row.pranati, row.eoghan].some(cell => cell && cell.trim())
        if (country && hasBook){
            read[country]= row
        }
    })
    console.log(read)
    fetch("https://raw.githubusercontent.com/vasturiano/globe.gl/master/example/datasets/ne_110m_admin_0_countries.geojson")
    .then(res=> res.json())
    .then(countries=> {
        console.log(countries.features[0].properties)
        const shapeNames = countries.features.map(f => f.properties.ADMIN)
        const unmatched = Object.keys(read).filter(name => !shapeNames.includes(name))
        console.log("No match in map:", unmatched)
        myGlobe
            .polygonsData(countries.features)
            .polygonCapColor(d=> read[d.properties.ADMIN]? "#4da6ff" : "rgba(100,100,100,0.4)")
            .polygonSideColor(() => "rgba(0,0,0,0.1)")
            .polygonStrokeColor(() => "#111")
            .polygonLabel(d=>{
                //getting the country's name
                const name = d.properties.ADMIN
                const row = read[name]
                if (!row) return `<b>${name}</b><br>No books yet`
                
                let html = `<b>${name}</b>`
                const readers = ["summayah", "pranati", "eoghan"]

                readers.forEach(person => {
                    const cell = row[person]
                    if (cell && cell.trim()){
                        const books = cell.split(/[;\n]/).map(b => b.trim()).filter(Boolean)
                        const label = person[0].toUpperCase() + person.slice(1)
                        html += `<br><b>${label}</b><br>${books.join("<br>")}`
                    }
                })
                return html
            })

    })
  })
            </script>
        </body>
</html>
